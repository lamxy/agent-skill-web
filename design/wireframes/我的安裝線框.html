<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的安裝線框 · Install Registry</title><style>
:root{--ink:#16181d;--soft:#5b616e;--faint:#8b91a0;--line:#dfe2e8;--line2:#edeff3;--paper:#fff;--ground:#f6f7f9;--accent:#1f4fd8;--accent2:#eef2fe;--ok:#1a7f52;--ok2:#e8f5ee;--warn:#8a5a00;--warn2:#fdf3e0;--stop:#a32020;--stop2:#fdeceb;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;--r:8px;--rl:11px;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--ink:#e8eaf0;--soft:#a2a9b8;--faint:#767d8d;--line:#2f333c;--line2:#24272e;--paper:#1a1d23;--ground:#131519;--accent:#7f9fff;--accent2:#1c2740;--ok:#5ec98e;--ok2:#14301f;--warn:#e0ab4c;--warn2:#33260d;--stop:#f08a80;--stop2:#3a1917}}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}button,input{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.mono{font-family:var(--mono)}#stage{min-height:100vh;padding-bottom:92px}.shell{min-height:100vh;display:flex;flex-direction:column}.top{min-height:58px;padding:0 max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;gap:42px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{font-size:16px;font-weight:750;white-space:nowrap}.nav{display:flex;gap:28px;color:var(--soft);white-space:nowrap}.nav span{padding:18px 0 16px;border-bottom:2px solid transparent}.nav .active{color:var(--accent);border-color:var(--accent);font-weight:650}.main{width:min(1120px,calc(100% - 48px));margin:auto;padding:32px 0 70px;flex:1}.foot{padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;background:var(--paper);border-top:1px solid var(--line);color:var(--faint);font-size:12px}.head{display:flex;justify-content:space-between;align-items:start;gap:24px;margin-bottom:20px}.head h1{margin:0;font-size:27px;letter-spacing:-.03em}.head p{margin:7px 0 0;color:var(--soft)}.summary{display:flex;gap:8px}.metric{min-width:112px;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}.metric b{display:block;font-size:20px}.metric span{color:var(--faint);font-size:10.5px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--rl);background:var(--paper)}.segments{display:flex;gap:4px}.segments button{border:0;border-radius:7px;background:transparent;padding:8px 11px;color:var(--soft)}.segments [data-active]{background:var(--accent2);color:var(--accent);font-weight:650}.search{width:260px;min-height:37px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground)}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rl);box-shadow:0 1px 3px rgba(22,24,29,.06);overflow:hidden}.desktop table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line2)}th{background:var(--ground);color:var(--faint);font-size:10px;text-transform:uppercase}.pkg{display:grid;gap:3px}.pkg b{font-size:13.5px}.pkg small{color:var(--faint)}.versions{display:flex;align-items:center;gap:8px}.arrow{color:var(--accent)}.tag{display:inline-flex;padding:3px 8px;border-radius:999px;background:var(--ok2);color:var(--ok);font-size:11.5px}.tag.up{background:var(--warn2);color:var(--warn)}.actions{display:flex;justify-content:flex-end;gap:7px}.btn{min-height:37px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:620;white-space:nowrap}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.stop{border-color:var(--stop);color:var(--stop)}.mobile{display:none}.mobile article{padding:16px;border-bottom:1px solid var(--line)}.mobile article:last-child{border:0}.mobile-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.mobile-version{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px;margin:13px 0;border-radius:var(--r);background:var(--ground)}.mobile-version span{display:block;color:var(--faint);font-size:10px}.mobile-version b{display:block;margin-top:3px}.mobile .actions{display:grid;grid-template-columns:1fr 1fr}.empty{display:none;padding:45px 20px;text-align:center;color:var(--soft)}dialog{width:min(520px,calc(100% - 32px));padding:0;border:1px solid var(--line);border-radius:var(--rl);background:var(--paper);color:var(--ink)}dialog::backdrop{background:#0f11166f}.dialog{padding:20px}.dialog h2{margin:0 0 7px}.dialog p{color:var(--soft)}.route{padding:11px 12px;margin:14px 0;border-radius:var(--r);background:var(--ground);font:11.5px/1.6 var(--mono);overflow-wrap:anywhere}.contract{padding:10px 11px;margin-bottom:16px;border-radius:var(--r);background:var(--warn2);color:var(--soft);font-size:11.5px}.contract b{color:var(--warn)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.enter{animation:rise .22s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:760px){.top{padding:10px 20px;align-items:start;gap:10px;flex-direction:column}.nav{width:100%;overflow:auto}.nav span{padding:6px 0 8px}.head{flex-direction:column}.summary{width:100%}.metric{flex:1}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:640px){.top{padding-left:16px;padding-right:16px}.main{width:calc(100% - 32px);padding-top:22px}.foot{padding:17px 16px 96px;flex-direction:column}.desktop{display:none}.mobile{display:block}.segments{overflow:auto}.segments button{white-space:nowrap}.mobile-version{grid-template-columns:1fr}.mobile-version .arrow{display:none}.mobile .actions{grid-template-columns:1fr}.dialog-actions{display:grid;grid-template-columns:1fr 1fr}dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0}}
</style></head><body><div id="stage"></div><nav class="proto-picker"><span class="proto-picker-highlight"></span><button class="proto-picker-item" data-active aria-current="true">Install Registry</button><span class="proto-picker-divider"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav><script>
const items=[{packageId:'pkg-analytics',packageName:'分析工具',currentVersion:'1.9.0',status:'installed',availableVersion:'1.10.0',upgradeAvailable:true}];
const esc=s=>{const n=document.createElement('span');n.textContent=s;return n.innerHTML};const row=x=>`<tr data-upgrade="${x.upgradeAvailable}"><td><span class="pkg"><b>${esc(x.packageName)}</b><small class="mono">${esc(x.packageId)}</small></span></td><td><div class="versions"><span class="mono">${esc(x.currentVersion)}</span><span class="arrow">→</span><b class="mono">${esc(x.availableVersion)}</b></div></td><td><span class="tag">${x.status}</span></td><td>${x.upgradeAvailable?'<span class="tag up">可升級</span>':'<span class="tag">已是最新版</span>'}</td><td><div class="actions">${x.upgradeAvailable?`<button class="btn primary" data-upgrade-id="${x.packageId}">查看升級</button>`:''}<button class="btn stop" data-uninstall="${x.packageId}">取得卸載腳本</button></div></td></tr>`;
const mobile=x=>`<article data-upgrade="${x.upgradeAvailable}"><div class="mobile-top"><span class="pkg"><b>${esc(x.packageName)}</b><small class="mono">${esc(x.packageId)}</small></span>${x.upgradeAvailable?'<span class="tag up">可升級</span>':'<span class="tag">最新版</span>'}</div><div class="mobile-version"><div><span>目前版本</span><b class="mono">${x.currentVersion}</b></div><b class="arrow">→</b><div><span>可用版本</span><b class="mono">${x.availableVersion}</b></div></div><div class="actions">${x.upgradeAvailable?`<button class="btn primary" data-upgrade-id="${x.packageId}">查看升級</button>`:''}<button class="btn stop" data-uninstall="${x.packageId}">取得卸載腳本</button></div></article>`;
const page=()=>`<div class="shell enter"><header class="top"><b class="brand">Agent 技能平台</b><nav class="nav"><span>技能池</span><span class="active">我的安裝</span><span>上架技能</span><span>審核</span></nav></header><main class="main"><header class="head"><div><h1>我的安裝</h1><p>以目前 UID 的最後成功安裝事件折疊清單；匿名身份不可讀取。</p></div><div class="summary"><div class="metric"><b>${items.length}</b><span>已安裝套件</span></div><div class="metric"><b>${items.filter(x=>x.upgradeAvailable).length}</b><span>可升級</span></div></div></header><div class="toolbar"><div class="segments"><button data-filter="all" data-active>全部</button><button data-filter="upgrade">可升級</button><button data-filter="latest">已是最新版</button></div><input class="search" data-search placeholder="依套件名稱或 Package ID 篩選"></div><section class="card"><div class="desktop"><table><thead><tr><th>套件</th><th>目前 / 可用版本</th><th>安裝狀態</th><th>升級狀態</th><th></th></tr></thead><tbody data-body>${items.map(row).join('')}</tbody></table></div><div class="mobile" data-mobile>${items.map(mobile).join('')}</div><div class="empty" data-empty>沒有符合條件的已安裝套件。</div></section></main><footer class="foot"><span>Agent 技能平台 · 企業內部使用</span><span>MyInstallation[] · PC / Mobile adaptive wireframe</span></footer><dialog data-dialog><div class="dialog"><h2 data-title>取得卸載腳本</h2><p data-copy></p><div class="route" data-route></div><div class="contract"><b>現有前端契約缺口</b><br>InstallPreviewPage 目前把 action 固定為 install。正式實作卸載入口前，需讓腳本生成呼叫傳入 action: uninstall；OS 與 Client 必須從 CatalogDetail 選擇，不從 MyInstallation 推測。</div><div class="dialog-actions"><button class="btn" data-close>返回</button><button class="btn primary" data-continue>前往選擇目標</button></div></div></dialog></div>`;
let filter='all';const stage=document.querySelector('#stage');function mount(){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=page();wire()})}function apply(){const q=stage.querySelector('[data-search]').value.trim().toLowerCase();let shown=0;stage.querySelectorAll('[data-upgrade]').forEach(el=>{const up=el.dataset.upgrade==='true',match=(filter==='all'||filter==='upgrade'&&up||filter==='latest'&&!up)&&el.textContent.toLowerCase().includes(q);el.hidden=!match;if(match)shown++});stage.querySelector('[data-empty]').style.display=shown?'none':'block'}function wire(){const dialog=stage.querySelector('dialog');stage.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;stage.querySelectorAll('[data-filter]').forEach(x=>x.toggleAttribute('data-active',x===b));apply()});stage.querySelector('[data-search]').oninput=apply;stage.querySelectorAll('[data-uninstall]').forEach(b=>b.onclick=()=>{const x=items.find(v=>v.packageId===b.dataset.uninstall);stage.querySelector('[data-copy]').textContent=`先為 ${x.packageName} ${x.currentVersion} 選擇已聲明支援的 OS 與 Client，再生成解除安裝腳本。`;stage.querySelector('[data-route]').textContent=`/packages/${x.packageId}/versions/${x.currentVersion}/install?action=uninstall`;dialog.showModal()});stage.querySelector('[data-close]').onclick=()=>dialog.close();stage.querySelector('[data-continue]').onclick=()=>{stage.querySelector('[data-copy]').textContent='線框已導向套件目標選擇；本頁不虛構 OS / Client 欄位。'};stage.querySelectorAll('[data-upgrade-id]').forEach(b=>b.onclick=()=>{b.textContent='將前往套件詳情';b.disabled=true})}mount();const picker=document.querySelector('.proto-picker'),item=picker.querySelector('.proto-picker-item:not(.proto-picker-replay)'),hi=picker.querySelector('.proto-picker-highlight');requestAnimationFrame(()=>requestAnimationFrame(()=>{hi.style.width=item.offsetWidth+'px';hi.style.transform=`translateX(${item.offsetLeft}px)`}));picker.querySelector('.proto-picker-replay').onclick=mount;
</script></body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稽核日誌線框 · Audit Ledger</title><style>
:root{--ink:#16181d;--soft:#5b616e;--faint:#8b91a0;--line:#dfe2e8;--line2:#edeff3;--paper:#fff;--ground:#f6f7f9;--accent:#1f4fd8;--accent2:#eef2fe;--ok:#1a7f52;--ok2:#e8f5ee;--warn:#8a5a00;--warn2:#fdf3e0;--stop:#a32020;--stop2:#fdeceb;--seal:#6b5bd2;--seal2:#efecfd;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;--r:8px;--rl:11px;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--ink:#e8eaf0;--soft:#a2a9b8;--faint:#767d8d;--line:#2f333c;--line2:#24272e;--paper:#1a1d23;--ground:#131519;--accent:#7f9fff;--accent2:#1c2740;--ok:#5ec98e;--ok2:#14301f;--warn:#e0ab4c;--warn2:#33260d;--stop:#f08a80;--stop2:#3a1917;--seal:#a99cf0;--seal2:#221d3d}}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.mono{font-family:var(--mono)}#stage{min-height:100vh;padding-bottom:92px}.shell{min-height:100vh;display:flex;flex-direction:column}.top{min-height:58px;padding:0 max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:42px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{font-size:16px;font-weight:750;white-space:nowrap}.nav{display:flex;gap:28px;color:var(--soft);white-space:nowrap}.nav span{padding:18px 0 16px;border-bottom:2px solid transparent}.nav .active{color:var(--accent);border-color:var(--accent);font-weight:650}.main{width:min(1180px,calc(100% - 48px));margin:auto;padding:28px 0 70px;flex:1}.foot{padding:20px max(24px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;background:var(--paper);border-top:1px solid var(--line);color:var(--faint);font-size:12px}.crumb{color:var(--faint);font-size:12px;margin-bottom:12px}.head{display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:18px}.head h1{margin:0;font-size:26px;letter-spacing:-.03em}.head p{margin:7px 0 0;color:var(--soft)}.assurance{padding:5px 9px;border-radius:999px;background:var(--seal2);color:var(--seal);font-size:11.5px;font-weight:650}.tabs{display:flex;gap:4px;padding:4px;margin-bottom:16px;border:1px solid var(--line);border-radius:var(--rl);background:var(--paper);overflow:auto}.tabs button{border:0;background:transparent;padding:9px 13px;border-radius:7px;color:var(--soft);white-space:nowrap}.tabs [data-active]{background:var(--accent2);color:var(--accent);font-weight:650}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;box-shadow:0 1px 3px rgba(22,24,29,.06)}.filters{display:grid;grid-template-columns:1.1fr 1fr .8fr 1fr 1fr auto;gap:9px;align-items:end;padding:15px;border-bottom:1px solid var(--line)}.field{display:grid;gap:5px}.field label{font-size:10.5px;color:var(--faint);font-weight:650;text-transform:uppercase}input,select{width:100%;min-height:37px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground)}.btn{min-height:37px;padding:7px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:620;white-space:nowrap}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.summary{display:flex;justify-content:space-between;gap:16px;padding:10px 14px;background:var(--ground);color:var(--soft);font-size:11.5px}.table-wrap{overflow:auto}table{width:100%;min-width:920px;border-collapse:collapse}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line2)}th{color:var(--faint);font-size:10px;text-transform:uppercase;background:var(--paper)}tbody tr:hover{background:var(--accent2)}.event{display:grid;gap:3px}.event b{font-size:12.5px}.event small{color:var(--faint)}.tag{display:inline-flex;padding:3px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:11px}.tag.role{background:var(--seal2);color:var(--seal)}.tag.stop{background:var(--stop2);color:var(--stop)}.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;color:var(--soft);font-size:11.5px}.mobile{display:none}.mobile article{padding:15px;border-bottom:1px solid var(--line)}.mobile article:last-child{border:0}.mobile-top{display:flex;justify-content:space-between;gap:12px}.mobile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.mobile-grid span{display:block;color:var(--faint);font-size:10px;text-transform:uppercase}.mobile-grid b{display:block;margin-top:2px;font-size:11.5px;overflow-wrap:anywhere}.mobile .btn{width:100%}dialog{width:min(620px,calc(100% - 32px));padding:0;border:1px solid var(--line);border-radius:var(--rl);background:var(--paper);color:var(--ink)}dialog::backdrop{background:#0f11166f}.dialog{padding:20px}.dialog h2{margin:0 0 4px}.dialog-sub{color:var(--soft);margin:0 0 16px}.detail{display:grid;grid-template-columns:130px 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.detail dt,.detail dd{margin:0;padding:9px 11px;border-bottom:1px solid var(--line2)}.detail dt{background:var(--ground);color:var(--faint);font-size:11px}.detail dd{overflow-wrap:anywhere}.detail dt:last-of-type,.detail dd:last-child{border-bottom:0}.json{padding:11px;background:#101217;color:#e8eaf0;font:12px/1.6 var(--mono);white-space:pre-wrap}.dialog-actions{display:flex;justify-content:flex-end;margin-top:16px}.enter{animation:rise .22s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:920px){.top{padding:10px 20px;align-items:start;gap:10px;flex-direction:column}.nav{width:100%;overflow:auto}.nav span{padding:6px 0 8px}.filters{grid-template-columns:1fr 1fr 1fr}.head{flex-direction:column}}@media(max-width:640px){.top{padding-left:16px;padding-right:16px}.main{width:calc(100% - 32px);padding-top:20px}.foot{padding:17px 16px 96px;flex-direction:column}.tabs{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0}.filters{grid-template-columns:1fr}.desktop{display:none}.mobile{display:block}.summary{align-items:start;flex-direction:column}.mobile-grid{grid-template-columns:1fr}.pager{align-items:stretch;flex-direction:column}.pager .btn{width:100%}.detail{grid-template-columns:95px 1fr}dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0}.dialog-actions .btn{width:100%}}
</style></head><body><div id="stage"></div><nav class="proto-picker"><span class="proto-picker-highlight"></span><button class="proto-picker-item" data-active aria-current="true">Audit Ledger</button><span class="proto-picker-divider"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav><script>
const logs=[{id:'2',eventType:'reviewer.revoked',actorUid:'admin-1',targetType:'role',targetId:'assignment-1',action:'revoke_reviewer',details:{category:'frontend'},occurredAt:'2026-08-25T07:00:00.000Z'},{id:'1',eventType:'reviewer.assigned',actorUid:'admin-1',targetType:'role',targetId:'assignment-1',action:'assign_reviewer',details:{category:'frontend'},ipAddress:'127.0.0.1',userAgent:'vitest',occurredAt:'2026-08-25T06:00:00.000Z'}];
const esc=s=>{const n=document.createElement('span');n.textContent=s;return n.innerHTML},fmt=s=>new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'medium',timeZone:'Asia/Tokyo'}).format(new Date(s));
const row=x=>`<tr><td class="mono">${fmt(x.occurredAt)}</td><td><span class="event"><b>${esc(x.eventType)}</b><small class="mono">${esc(x.action)}</small></span></td><td class="mono">${esc(x.actorUid)}</td><td><span class="tag role">${esc(x.targetType)}</span></td><td class="mono">${esc(x.targetId)}</td><td><button class="btn" data-detail="${x.id}">查看</button></td></tr>`;
const mobile=x=>`<article><div class="mobile-top"><span class="event"><b>${esc(x.eventType)}</b><small class="mono">${esc(x.action)}</small></span><span class="tag role">${esc(x.targetType)}</span></div><div class="mobile-grid"><div><span>發生時間</span><b class="mono">${fmt(x.occurredAt)}</b></div><div><span>操作者</span><b class="mono">${esc(x.actorUid)}</b></div><div><span>目標</span><b class="mono">${esc(x.targetId)}</b></div></div><button class="btn" data-detail="${x.id}">查看完整事件</button></article>`;
const page=()=>`<div class="shell enter"><header class="top"><b class="brand">Agent 技能平台</b><nav class="nav"><span>技能池</span><span>我的安裝</span><span>上架技能</span><span>審核</span><span class="active">管理</span></nav></header><main class="main"><div class="crumb">管理後台 / 稽核日誌</div><header class="head"><div><h1>不可變稽核日誌</h1><p>依操作者、事件、目標與時間定位治理行為；內容只讀，按 occurredAt + id 穩定分頁。</p></div><span class="assurance">僅 platform_admin</span></header><nav class="tabs"><button>審核者管理</button><button>版本治理</button><button data-active>稽核日誌</button></nav><section class="card"><form class="filters" data-filters><div class="field"><label>eventType</label><select name="eventType"><option value="">全部事件</option><option>reviewer.assigned</option><option>reviewer.revoked</option></select></div><div class="field"><label>actorUid</label><input name="actorUid" value="admin-1"></div><div class="field"><label>targetType</label><select name="targetType"><option value="">全部</option><option selected>role</option><option>package</option><option>version</option><option>user</option></select></div><div class="field"><label>targetId</label><input name="targetId" value="assignment-1"></div><div class="field"><label>from</label><input name="from" type="datetime-local" value="2026-08-25T00:00"></div><button class="btn primary">套用篩選</button></form><div class="summary"><span data-summary>2 筆事件 · 依發生時間由新到舊</span><span>每頁 50 筆 · cursor 分頁</span></div><div class="desktop table-wrap"><table><thead><tr><th>發生時間</th><th>事件 / Action</th><th>操作者</th><th>目標類型</th><th>目標 ID</th><th></th></tr></thead><tbody data-body>${logs.map(row).join('')}</tbody></table></div><div class="mobile" data-mobile>${logs.map(mobile).join('')}</div><div class="pager"><span>本頁顯示真實 AuditLog 欄位</span><button class="btn" data-next>載入下一頁</button></div></section></main><footer class="foot"><span>Agent 技能平台 · 企業內部使用</span><span>AuditPage · PC / Mobile adaptive wireframe</span></footer><dialog data-dialog><div class="dialog"><h2 data-title></h2><p class="dialog-sub" data-sub></p><dl class="detail"><dt>id</dt><dd class="mono" data-id></dd><dt>actorUid</dt><dd class="mono" data-actor></dd><dt>target</dt><dd class="mono" data-target></dd><dt>ipAddress</dt><dd class="mono" data-ip></dd><dt>userAgent</dt><dd class="mono" data-agent></dd><dt>details</dt><dd class="json" data-json></dd></dl><div class="dialog-actions"><button class="btn" data-close>關閉</button></div></div></dialog></div>`;
const stage=document.querySelector('#stage');function mount(){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=page();wire()})}function wire(){const dialog=stage.querySelector('dialog');stage.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{const x=logs.find(v=>v.id===b.dataset.detail);stage.querySelector('[data-title]').textContent=x.eventType;stage.querySelector('[data-sub]').textContent=`${x.action} · ${fmt(x.occurredAt)}`;stage.querySelector('[data-id]').textContent=x.id;stage.querySelector('[data-actor]').textContent=x.actorUid;stage.querySelector('[data-target]').textContent=`${x.targetType} / ${x.targetId}`;stage.querySelector('[data-ip]').textContent=x.ipAddress??'未記錄';stage.querySelector('[data-agent]').textContent=x.userAgent??'未記錄';stage.querySelector('[data-json]').textContent=JSON.stringify(x.details,null,2);dialog.showModal()});stage.querySelector('[data-close]').onclick=()=>dialog.close();stage.querySelector('[data-filters]').onsubmit=e=>{e.preventDefault();stage.querySelector('[data-summary]').textContent='2 筆事件 · 已套用組合篩選'};stage.querySelector('[data-next]').onclick=e=>{e.currentTarget.disabled=true;e.currentTarget.textContent='沒有更多事件'}}mount();const picker=document.querySelector('.proto-picker'),item=picker.querySelector('.proto-picker-item:not(.proto-picker-replay)'),hi=picker.querySelector('.proto-picker-highlight');requestAnimationFrame(()=>requestAnimationFrame(()=>{hi.style.width=item.offsetWidth+'px';hi.style.transform=`translateX(${item.offsetLeft}px)`}));picker.querySelector('.proto-picker-replay').onclick=mount;
</script></body></html>

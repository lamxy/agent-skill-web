<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色管理線框 · Role Console</title>
<style>
:root{--ink:#16181d;--soft:#5b616e;--faint:#8b91a0;--line:#dfe2e8;--line2:#edeff3;--paper:#fff;--ground:#f6f7f9;--accent:#1f4fd8;--accent2:#eef2fe;--ok:#1a7f52;--ok2:#e8f5ee;--warn:#8a5a00;--warn2:#fdf3e0;--stop:#a32020;--stop2:#fdeceb;--seal:#6656cb;--seal2:#efecfd;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;--r:8px;--rl:11px;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#e8eaf0;--soft:#a2a9b8;--faint:#767d8d;--line:#2f333c;--line2:#24272e;--paper:#1a1d23;--ground:#131519;--accent:#7f9fff;--accent2:#1c2740;--ok:#5ec98e;--ok2:#14301f;--warn:#e0ab4c;--warn2:#33260d;--stop:#f08a80;--stop2:#3a1917;--seal:#a99bf0;--seal2:#221d3d}}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.mono{font-family:var(--mono)}#stage{min-height:100vh;padding-bottom:92px}.shell{min-height:100vh;display:flex;flex-direction:column}
.top{min-height:58px;padding:0 max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:42px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{font-size:16px;font-weight:750;white-space:nowrap}.nav{display:flex;gap:28px;color:var(--soft);white-space:nowrap}.nav span{padding:18px 0 16px;border-bottom:2px solid transparent}.nav .active{color:var(--accent);border-color:var(--accent);font-weight:650}
.main{width:min(1180px,calc(100% - 48px));margin:auto;padding:28px 0 70px;flex:1}.foot{padding:20px max(24px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;background:var(--paper);border-top:1px solid var(--line);color:var(--faint);font-size:12px}
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:16px;border:1px solid var(--line);border-radius:var(--rl);background:var(--paper);overflow:auto}.tabs span{padding:9px 13px;border-radius:7px;color:var(--soft);white-space:nowrap}.tabs .active{background:var(--accent2);color:var(--accent);font-weight:650}
.kicker{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin:0}
.head{display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:18px}.head h1{margin:4px 0 0;font-size:26px;letter-spacing:-.03em}.head p{margin:7px 0 0;color:var(--soft);max-width:62ch}.source{color:var(--faint);font-size:11.5px;white-space:nowrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;box-shadow:0 1px 3px rgba(22,24,29,.06);margin-bottom:16px}.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:center}.card-head h2{font-size:14px;margin:0}.card-head p{font-size:11.5px;color:var(--faint);margin:3px 0 0}
input,select{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground)}input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.btn{min-height:38px;padding:7px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:620;white-space:nowrap}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{border-color:var(--stop);color:var(--stop)}.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;padding:3px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:11.5px;white-space:nowrap}.tag.ok{background:var(--ok2);color:var(--ok)}.tag.seal{background:var(--seal2);color:var(--seal)}.tag.mute{background:var(--line2);color:var(--faint)}.tag.stop{background:var(--stop2);color:var(--stop)}
.lookup{display:grid;grid-template-columns:1fr auto;gap:8px;padding:16px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;padding:16px;align-items:start}.field{display:grid;gap:5px}.field label{font-size:11.5px;color:var(--soft);font-weight:600}.field small{color:var(--faint);font-size:11px;line-height:1.45}
.note{margin:0 16px 16px;padding:11px 13px;border-radius:var(--r);background:var(--accent2);color:var(--soft);font-size:12px;line-height:1.55}.note b{color:var(--accent)}.note.warn{background:var(--warn2)}.note.warn b{color:var(--warn)}.note.seal{background:var(--seal2)}.note.seal b{color:var(--seal)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line2)}th{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.06em}td:last-child,th:last-child{text-align:right}tbody tr:hover{background:var(--ground)}
.grp{background:var(--ground)}.grp td{font-weight:640;font-size:12.5px}
.empty{padding:34px 16px;text-align:center;color:var(--soft)}.empty strong{display:block;margin-bottom:5px}
.locked{display:flex;gap:10px;align-items:start;padding:12px 14px;margin:0 16px 16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--soft);font-size:12px;line-height:1.55}.locked .tag{flex-shrink:0}
dialog{width:min(460px,calc(100% - 32px));padding:0;border:1px solid var(--line);border-radius:var(--rl);background:var(--paper);color:var(--ink)}dialog::backdrop{background:#0f11166f}.dlg{padding:20px}.dlg h2{margin:0 0 8px;font-size:17px}.dlg p{color:var(--soft);margin:0 0 6px}.dlg ul{margin:8px 0 0;padding-left:18px;color:var(--soft);font-size:12.5px}.dlg-act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
.enter{animation:rise .22s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:900px){.form{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.top{padding:10px 20px;align-items:start;gap:10px;flex-direction:column}.nav{width:100%;overflow:auto}.nav span{padding:6px 0 8px}.head{flex-direction:column}.lookup{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}}
@media(max-width:640px){.top{padding-left:16px;padding-right:16px}.main{width:calc(100% - 32px);padding-top:20px}.foot{padding:17px 16px 96px;flex-direction:column;gap:6px}.form{grid-template-columns:1fr}.tabs{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0}dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:16px 16px 0 0}.dlg-act{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body><div id="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-view="loaded" data-active aria-current="true">已查詢</button><button class="proto-picker-item" data-view="start">未查詢</button><button class="proto-picker-item" data-view="none">無角色</button><span class="proto-picker-divider" aria-hidden="true"></span><button class="proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav>
<script>
const shell=(body)=>`<div class="shell enter"><header class="top"><b class="brand">Agent 技能平台</b><nav class="nav"><span>技能池</span><span>我的安裝</span><span>發布技能</span><span>審核</span><span class="active">管理</span></nav></header><main class="main"><nav class="tabs"><span>審核者管理</span><span class="active">角色管理</span><span>版本治理</span><span>支援與反饋</span><span>稽核日誌</span></nav><header class="head"><div><p class="kicker">管理後台</p><h1>角色管理</h1><p>授予與撤銷 maintainer 與 reviewer。一般員工不需角色，本來就能維護自己團隊的技能；平台管理員不在此授予。</p></div><span class="source">資料來源：RoleAssignment</span></header>${body}</main><footer class="foot"><span>Agent 技能平台 · 企業內部使用</span><span>GET/POST/DELETE /api/admin/roles · PC / Mobile adaptive wireframe</span></footer></div>`;

const lookup=(uid)=>`<section class="card"><div class="card-head"><div><h2>查詢使用者</h2><p>GET /api/admin/roles?uid= — 一次查一位使用者，沒有全平台角色總覽端點</p></div></div>
<div class="lookup"><select aria-label="使用者"><option${uid?'':' selected'} disabled>選擇有效使用者</option><option${uid?' selected':''}>李四 · zhangsan-004 · 資料庫平台</option><option>王五 · wangwu-011 · 公共架構</option><option>模擬使用者 · mock-user · development</option></select><button class="btn primary">查詢角色</button></div>
<p class="note"><b>候選來自 /api/admin/reviewer-candidates</b>　顯示姓名、UID 與所屬團隊；提交時只送 UID。停用中的身份不在清單內，因為後端授予時會擋下（IDENTITY_NOT_FOUND）。</p></section>`;

const grantForm=(disabled)=>`<section class="card"><div class="card-head"><div><h2>授予角色</h2><p>POST /api/admin/roles</p></div>${disabled?'<span class="tag mute">先查詢使用者</span>':'<span class="tag">目標：<span class="mono">zhangsan-004</span></span>'}</div>
<div class="form" style="grid-template-columns:2fr auto">
  <div class="field"><label>角色</label><select ${disabled?'disabled':''} data-role><option value="maintainer">maintainer — 可更新所有技能（跨團隊）</option><option value="reviewer">reviewer — 可審核所有技能，除自己送的</option></select><small data-role-hint>維護者可更新平台上任何團隊的技能。一般員工不需授予角色，本來就能維護自己團隊的技能。</small></div>
  <div class="field" style="align-self:start"><label>&nbsp;</label><button class="btn primary" ${disabled?'disabled':''}>授予角色</button></div>
</div>
</div>
<div class="locked"><span class="tag stop">不提供</span><div><b>platform_admin 不在此授予或撤銷。</b>它只能由部署設定的 BOOTSTRAP_ADMIN_UID 產生——若能在介面撤銷最後一位管理員，平台會永久失去授權能力。後端對這兩個操作都回 403（ROLE_NOT_GRANTABLE／ROLE_NOT_REVOCABLE）。</div></div></section>`;

const roleRows=`
<tr><td><b>maintainer</b><small style="display:block;color:var(--faint);font-size:11.5px;margin-top:2px">可更新所有技能，含其他團隊的</small></td><td class="mono">mock-admin</td><td>2026-08-20 14:30</td><td><button class="btn sm danger" data-revoke="maintainer">撤銷</button></td></tr>
<tr><td><b>reviewer</b><small style="display:block;color:var(--faint);font-size:11.5px;margin-top:2px">可審核所有技能，除自己送審的</small></td><td class="mono">mock-admin</td><td>2026-08-25 16:45</td><td><button class="btn sm danger" data-revoke="reviewer">撤銷</button></td></tr>`;

const roleList=(state)=>`<section class="card"><div class="card-head"><div><h2>目前角色</h2><p>${state==='none'?'GET /api/admin/roles?uid=wangwu-011':'GET /api/admin/roles?uid=zhangsan-004 — 只回傳 active 的指派'}</p></div>${state==='none'?'<span class="tag mute">0 筆</span>':'<span class="tag ok">2 筆有效</span>'}</div>
${state==='none'
 ? `<div class="empty"><strong>這位使用者目前沒有額外角色</strong><p>他仍然可以瀏覽技能池、安裝技能，並<strong>發布與更新自己團隊的技能</strong>——這些不需要任何角色。<br>只有需要跨團隊更新或審核時才授予角色。</p></div>`
 : `<table><thead><tr><th>角色</th><th>授予者</th><th>授予時間</th><th></th></tr></thead><tbody>${roleRows}</tbody></table>
<p class="note"><b>角色沒有範圍。</b>　權限收斂後，maintainer 與 reviewer 都是全平台生效，因此每個角色最多一筆、撤銷即整個角色移除。一般員工不需授予任何角色，本來就能維護自己團隊的技能。</p>`}</section>`;

const dialog=`<dialog data-dialog><div class="dlg"><h2 data-dlg-title>撤銷 maintainer？</h2><p>將撤銷 <b class="mono">zhangsan-004</b> 的 <b data-dlg-role>maintainer</b> 角色。</p><p data-dlg-effect>撤銷後他仍可維護自己團隊（資料庫平台）的技能，但無法再更新其他團隊的技能。</p><div class="dlg-act"><button class="btn" data-cancel>取消</button><button class="btn danger" data-confirm>確認撤銷</button></div></div></dialog>`;

const views={
 loaded:()=>shell(lookup(true)+grantForm(false)+roleList('loaded')+dialog),
 start:()=>shell(lookup(false)+grantForm(true)+`<section class="card"><div class="card-head"><div><h2>目前角色</h2><p>尚未查詢</p></div></div><div class="empty"><strong>先選擇一位使用者</strong><p>角色查詢一次針對一位使用者。平台沒有「列出所有角色指派」的端點，因此這裡不提供全平台總覽。</p></div></section>`),
 none:()=>shell(lookup(true)+grantForm(false)+roleList('none'))
};

const ROLE_HINT={
  maintainer:'維護者可更新平台上任何團隊的技能。一般員工不需授予角色，本來就能維護自己團隊的技能。',
  reviewer:'審核者可審核所有送審的版本，但不能審自己送的。審核範圍不需另外指定。'
};
const REVOKE_EFFECT={
  maintainer:'撤銷後他仍可維護自己團隊（資料庫平台）的技能，但無法再更新其他團隊的技能。',
  reviewer:'撤銷後他將無法再審核任何版本，審核工作台會變成空的。'
};

let view='loaded';
const stage=document.querySelector('#stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight');
function moveHighlight(){const el=picker.querySelector(`[data-view="${view}"]`);highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function wire(){
  const role=stage.querySelector('[data-role]');
  if(role)role.onchange=()=>{stage.querySelector('[data-role-hint]').textContent=ROLE_HINT[role.value]};
  const dlg=stage.querySelector('[data-dialog]');
  stage.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>{
    const r=b.dataset.revoke;
    stage.querySelector('[data-dlg-title]').textContent=`撤銷 ${r}？`;
    stage.querySelector('[data-dlg-role]').textContent=r;
    stage.querySelector('[data-dlg-effect]').textContent=REVOKE_EFFECT[r];
    dlg.showModal();
  });
  if(dlg){stage.querySelector('[data-cancel]').onclick=()=>dlg.close();stage.querySelector('[data-confirm]').onclick=()=>dlg.close();}
}
function mount(){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=views[view]();wire()})}
function sync(){picker.querySelectorAll('[data-view]').forEach(b=>{const on=b.dataset.view===view;b.toggleAttribute('data-active',on);b.setAttribute('aria-current',on?'true':'false')});moveHighlight();mount()}
picker.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;sync()});
mount();requestAnimationFrame(()=>requestAnimationFrame(()=>{moveHighlight();picker.setAttribute('data-ready','')}));
picker.querySelector('.proto-picker-replay').onclick=mount;
document.addEventListener('keydown',e=>{if(!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)&&(e.key==='r'||e.key==='R'))mount()});
</script></body></html>

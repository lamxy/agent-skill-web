p{background:var(--stop2);color:var(--stop)}.side{position:sticky;top:16px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px;border-bottom:1px solid var(--line)}.mode button{padding:9px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}.mode [data-active]{border-color:var(--accent);background:var(--accent2);color:var(--accent);font-weight:650}.form{display:grid;gap:13px;padding:16px}.field{display:grid;gap:5px}.field label{font-size:11.5px;color:var(--soft);font-weight:600}.danger-note{padding:10px 11px;border-radius:var(--r);background:var(--warn2);color:var(--soft);font-size:11.5px}.danger-note.stop{background:var(--stop2)}.danger-note b{color:var(--warn)}.danger-note.stop b{color:var(--stop)}.status{min-height:18px;color:var(--ok);font-size:11.5px}.result{display:none;padding:16px;margin:0 16px 16px;border-radius:var(--r);background:var(--ok2);color:var(--ok)}.result[data-show]{display:block}dialog{width:min(440px,calc(100% - 32px));padding:0;border:1px solid var(--line);border-radius:var(--rl);background:var(--paper);color:var(--ink)}dialog::backdrop{background:#0f11166f}.dialog{padding:20px}.dialog h2{margin:0 0 8px}.dialog p{color:var(--soft)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.enter{animation:rise .22s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}

<script>
const page=()=>`<div class="shell enter"><header class="top"><b class="brand">Agent 技能平台</b><nav class="nav"><span>技能池</span><span>我的安裝</span><span>上架技能</span><span>審核</span><span class="active">管理</span></nav></header><main class="main"><div class="crumb">管理後台 / 版本治理</div><header class="head"><div><h1>版本生命週期控制台</h1><p>先定位套件與版本，再執行標準撤下或緊急停用；兩者都保留理由與稽核記錄。</p></div><span class="tag" data-life>published</span></header><nav class="tabs"><button>審核者管理</button><button data-active>版本治理</button><button>稽核日誌</button></nav><aside class="alert"><b>不可逆操作</b><span>撤下或緊急停用後，下載與腳本生成會立即失效；提交前必須二次確認。</span></aside><div class="grid"><section class="card"><div class="card-head"><div><h2>選擇治理目標</h2><p>搜尋使用 GET /api/packages，再讀取 GET /api/packages/:packageId。</p></div></div><div class="lookup"><input value="review-api-skill" aria-label="Package ID 或名稱"><button class="btn" data-search>搜尋</button></div><div class="package"><div class="package-top"><div><h3>治理 API 技能</h3><p class="mono">review-api-skill · team-a · skill / frontend</p></div><span class="tag ok">active</span></div><div class="facts"><div class="fact"><span>Visibility</span><strong>public</strong></div><div class="fact"><span>Installations</span><strong>1</strong></div><div class="fact"><span>Source</span><strong class="mono">https://example.invalid/review-api-skill</strong></div><div class="fact"><span>License</span><strong>MIT</strong></div></div><table class="versions"><thead><tr><th>版本</th><th>生命週期</th><th>作者</th><th>支援 OS</th><th>殘留</th><th></th></tr></thead><tbody><tr data-selected><td class="mono">1.0.0</td><td><span class="tag ok" data-row-life>published</span></td><td class="mono">author-1</td><td>linux</td><td>保留快取</td><td><button class="btn" data-select>已選取</button></td></tr></tbody></table></div></section><aside class="card side"><div class="card-head"><div><h2>治理操作</h2><p class="mono">review-api-skill@1.0.0</p></div></div><div class="mode"><button data-mode="delist" data-active>標準撤下</button><button data-mode="emergency">緊急停用</button></div><form class="form" data-form><div class="field"><label>reasonCode</label><input name="reasonCode" value="policy_change" maxlength="200" required></div><div class="field"><label>reasonDetail</label><textarea name="reasonDetail" maxlength="5000">不再提供</textarea></div><div class="field" data-effective><label>effectiveAt</label><input name="effectiveAt" type="datetime-local" value="2026-08-28T12:00" required></div><div class="danger-note" data-note><b>標準撤下</b><br>可指定生效時間，並通知受影響的 UID 使用者。</div><div class="status" data-status></div><button class="btn warn" type="submit" data-submit>確認撤下內容</button></form><div class="result" data-result>版本狀態已由伺服器回傳為 <b data-result-life>delisted</b>。</div></aside></div></main><footer class="foot"><span>Agent 技能平台 · 企業內部使用</span><span>PackageVersionRecord · PC / Mobile adaptive wireframe</span></footer><dialog data-dialog><div class="dialog"><h2 data-dialog-title>確認撤下 1.0.0？</h2><p data-dialog-copy>此操作會讓下載與腳本生成失效。</p><div class="dialog-actions"><button class="btn" data-cancel>返回檢查</button><button class="btn warn" data-confirm>確認執行</button></div></div></dialog></div>`;
let mode='delist';const stage=document.querySelector('#stage'),picker=document.querySelector('.proto-picker'),item=picker.querySelector('.proto-picker-item:not(.proto-picker-replay)'),highlight=picker.querySelector('.proto-picker-highlight');
function mount(){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=page();wire()})}function wire(){const dialog=stage.querySelector('dialog');stage.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;stage.querySelectorAll('[data-mode]').forEach(x=>x.toggleAttribute('data-active',x===b));const emergency=mode==='emergency';stage.querySelector('[data-effective]').hidden=emergency;stage.querySelector('[name=reasonCode]').value=emergency?'critical_issue':'policy_change';stage.querySelector('[name=reasonDetail]').value=emergency?'立即停用':'不再提供';stage.querySelector('[data-note]').className='danger-note'+(emergency?' stop':'');stage.querySelector('[data-note]').innerHTML=emergency?'<b>緊急停用</b><br>僅 global platform_admin 可執行，立即阻止下載與腳本生成。':'<b>標準撤下</b><br>可指定生效時間，並通知受影響的 UID 使用者。';stage.querySelector('[data-submit]').className='btn '+(emergency?'stop':'warn');stage.querySelector('[data-submit]').textContent=emergency?'確認緊急停用內容':'確認撤下內容'});stage.querySelector('[data-form]').onsubmit=e=>{e.preventDefault();const emergency=mode==='emergency';stage.querySelector('[data-dialog-title]').textContent=emergency?'緊急停用 1.0.0？':'確認撤下 1.0.0？';stage.querySelector('[data-dialog-copy]').textContent=emergency?'此操作立即生效，只有 platform_admin 可以執行。':'此操作會在 effectiveAt 生效，並通知受影響的 UID。';stage.querySelector('[data-confirm]').className='btn '+(emergency?'stop':'warn');dialog.showModal()};stage.querySelector('[data-cancel]').onclick=()=>dialog.close();stage.querySelector('[data-confirm]').onclick=()=>{const life=mode==='emergency'?'emergency_disabled':'delisted';dialog.close();stage.querySelector('[data-life]').textContent=life;stage.querySelector('[data-life]').className='tag stop';stage.querySelector('[data-row-life]').textContent=life;stage.querySelector('[data-row-life]').className='tag stop';stage.querySelector('[data-form]').hidden=true;stage.querySelector('[data-result]').setAttribute('data-show','');stage.querySelector('[data-result-life]').textContent=life};stage.querySelector('[data-search]').onclick=()=>stage.querySelector('[data-status]').textContent='已載入 review-api-skill 的 CatalogDetail。'}
mount();requestAnimationFrame(()=>requestAnimationFrame(()=>{highlight.style.width=item.offsetWidth+'px';highlight.style.transform=`translateX(${item.offsetLeft}px)`;picker.setAttribute('data-ready','')}));picker.querySelector('.proto-picker-replay').onclick=mount;document.addEventListener('keydown',e=>{if(!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)&&(e.key==='r'||e.key==='R'))mount()});
</script></body></html>

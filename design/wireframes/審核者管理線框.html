<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>審核者管理線框 · Scope Registry</title>
  <style>
    :root {
      --ink: #16181d; --ink-soft: #5b616e; --ink-faint: #8b91a0;
      --line: #dfe2e8; --line-soft: #edeff3;
      --paper: #ffffff; --ground: #f6f7f9;
      --accent: #1f4fd8; --accent-soft: #eef2fe; --accent-ink: #ffffff;
      --ok: #1a7f52; --ok-soft: #e8f5ee;
      --warn: #8a5a00; --warn-soft: #fdf3e0;
      --stop: #a32020; --stop-soft: #fdeceb;
      --seal: #6b5bd2; --seal-soft: #efecfd;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
      --radius: 8px; --radius-lg: 11px; --shadow: 0 1px 3px rgba(22, 24, 29, .06);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #e8eaf0; --ink-soft: #a2a9b8; --ink-faint: #767d8d;
        --line: #2f333c; --line-soft: #24272e;
        --paper: #1a1d23; --ground: #131519;
        --accent: #7f9fff; --accent-soft: #1c2740; --accent-ink: #0e1014;
        --ok: #5ec98e; --ok-soft: #14301f;
        --warn: #e0ab4c; --warn-soft: #33260d;
        --stop: #f08a80; --stop-soft: #3a1917;
        --seal: #a99cf0; --seal-soft: #221d3d;
        --shadow: 0 1px 3px rgba(0, 0, 0, .3);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #stage { min-height: 100vh; padding-bottom: 92px; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .shell-top { min-height: 58px; padding: 0 max(24px, calc((100vw - 1180px) / 2)); background: var(--paper); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 42px; }
    .brand { font-size: 16px; font-weight: 750; white-space: nowrap; }
    .nav { display: flex; gap: 28px; color: var(--ink-soft); white-space: nowrap; }
    .nav span { padding: 18px 0 16px; border-bottom: 2px solid transparent; }
    .nav .active { color: var(--accent); border-color: var(--accent); font-weight: 650; }
    .main { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0 70px; flex: 1; }
    .foot { display: flex; justify-content: space-between; gap: 16px; padding: 20px max(24px, calc((100vw - 1180px) / 2)); border-top: 1px solid var(--line); background: var(--paper); color: var(--ink-faint); font-size: 12px; }
    .crumb { margin-bottom: 12px; color: var(--ink-faint); font-size: 12.5px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.028em; }
    h2, h3, p { margin-top: 0; }
    .subtitle { max-width: 68ch; margin: 7px 0 0; color: var(--ink-soft); }
    .head-stat { display: flex; gap: 8px; align-items: center; padding-top: 2px; white-space: nowrap; }
    .head-stat strong { font-size: 22px; letter-spacing: -.03em; }
    .head-stat span { color: var(--ink-soft); font-size: 12px; }
    .admin-tabs { display: flex; gap: 4px; padding: 4px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--paper); overflow-x: auto; }
    .admin-tabs button { min-height: 34px; padding: 0 13px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-soft); white-space: nowrap; }
    .admin-tabs button[data-active] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .contract-note { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 12px 14px; margin-bottom: 16px; border: 1px dashed var(--warn); border-radius: var(--radius); background: var(--warn-soft); color: var(--ink-soft); font-size: 12px; }
    .contract-note strong { color: var(--warn); white-space: nowrap; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
    .card { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--paper); box-shadow: var(--shadow); overflow: hidden; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .card-head h2 { margin: 0; font-size: 14.5px; }
    .card-head p { margin: 3px 0 0; color: var(--ink-faint); font-size: 11.5px; }
    .tools { display: flex; gap: 8px; align-items: end; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--ink-soft); font-size: 11.5px; font-weight: 600; }
    .field input, .field select { width: 100%; min-height: 38px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--ground); }
    .field input:focus, .field select:focus { border-color: var(--accent); background: var(--paper); }
    .filter { min-width: 170px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th { padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--ground); color: var(--ink-faint); font-size: 10.5px; font-weight: 650; letter-spacing: .05em; text-align: left; text-transform: uppercase; }
    td { padding: 13px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    .reviewer { display: grid; gap: 2px; }
    .reviewer strong { font-size: 13px; }
    .reviewer small { color: var(--ink-faint); font-size: 11px; }
    .scope { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { display: inline-flex; align-items: center; min-height: 23px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; white-space: nowrap; }
    .tag.seal { background: var(--seal-soft); color: var(--seal); }
    .tag.ok { background: var(--ok-soft); color: var(--ok); }
    .tag.muted { background: var(--line-soft); color: var(--ink-soft); }
    .btn { min-height: 36px; padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); font-size: 12.5px; font-weight: 620; }
    .btn:hover { border-color: var(--ink-faint); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .btn.stop { border-color: var(--stop); color: var(--stop); }
    .btn[disabled] { cursor: not-allowed; opacity: .45; }
    .mobile-list { display: none; }
    .mobile-card { padding: 15px; border-bottom: 1px solid var(--line); }
    .mobile-card:last-child { border-bottom: 0; }
    .mobile-top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
    .mobile-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 13px 0; }
    .mobile-meta span { display: block; color: var(--ink-faint); font-size: 10.5px; text-transform: uppercase; }
    .mobile-meta strong { display: block; margin-top: 3px; font-size: 12px; overflow-wrap: anywhere; }
    .mobile-card .btn { width: 100%; }
    .add-panel { position: sticky; top: 16px; }
    .add-body { display: grid; gap: 14px; padding: 16px; }
    .add-note { padding: 10px 11px; border-radius: var(--radius); background: var(--accent-soft); color: var(--ink-soft); font-size: 11.5px; }
    .add-note b { color: var(--accent); }
    .form-status { min-height: 18px; color: var(--ok); font-size: 11.5px; }
    .add-body .btn { width: 100%; }
    .empty-state { display: none; padding: 34px 20px; color: var(--ink-soft); text-align: center; }
    dialog { width: min(430px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--paper); color: var(--ink); box-shadow: 0 24px 64px rgba(0, 0, 0, .28); }
    dialog::backdrop { background: rgba(15, 17, 22, .45); }
    .dialog-body { padding: 20px; }
    .dialog-body h2 { margin-bottom: 7px; font-size: 18px; }
    .dialog-body p { margin-bottom: 17px; color: var(--ink-soft); }
    .dialog-scope { padding: 11px 12px; margin-bottom: 17px; border-radius: var(--radius); background: var(--ground); font-size: 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .toast { position: fixed; right: 24px; bottom: 84px; z-index: 20; padding: 11px 14px; border-radius: var(--radius); background: var(--ink); color: var(--paper); box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 12px; opacity: 0; transform: translateY(5px); pointer-events: none; }
    .toast[data-show] { animation: toast 2.2s ease-out both; }
    .enter { animation: rise 220ms ease-out both; transform-origin: top center; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toast { 0% { opacity: 0; transform: translateY(5px); } 10%, 82% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }

    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }

    /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }

    .proto-picker-item {
      position: relative; /* sits above the highlight */
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }

    .proto-picker-item:hover {
      color: rgba(255, 255, 255, 0.85);
    }

    .proto-picker-item:active {
      transform: scale(0.97);
    }

    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .proto-picker-item[data-active] {
      color: #fff;
    }

    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }

    .proto-picker-replay {
      padding: 0 10px;
      font-size: 14px;
    }

    .proto-picker[data-position="top"] {
      bottom: auto;
      top: 24px;
    }

    @media (prefers-reduced-motion: reduce) {
      .enter, .toast[data-show] { animation: none; }
    }
    @media (max-width: 820px) {
      .shell-top { padding: 10px 20px; align-items: flex-start; gap: 10px; flex-direction: column; }
      .nav { width: 100%; overflow-x: auto; gap: 22px; }
      .nav span { padding: 6px 0 8px; }
      .layout { grid-template-columns: 1fr; }
      .add-panel { position: static; grid-row: 1; }
    }
    @media (max-width: 640px) {
      .shell-top { padding-left: 16px; padding-right: 16px; }
      .main { width: calc(100% - 32px); padding-top: 20px; }
      .foot { padding: 17px 16px 96px; flex-direction: column; }
      .page-head { gap: 12px; flex-direction: column; }
      h1 { font-size: 23px; }
      .head-stat { padding: 0; }
      .admin-tabs { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; border-left: 0; border-right: 0; border-radius: 0; }
      .contract-note { grid-template-columns: 1fr; }
      .desktop-table { display: none; }
      .mobile-list { display: block; }
      .tools { width: 100%; }
      .filter { width: 100%; }
      .card-head { align-items: flex-start; flex-direction: column; }
      .mobile-meta { grid-template-columns: 1fr; }
      .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; }
      dialog { width: 100%; max-width: none; margin: auto 0 0; border-radius: 16px 16px 0 0; }
      .toast { left: 16px; right: 16px; bottom: 82px; text-align: center; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>

  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Scope Registry</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>

  <script>
    const INITIAL_ASSIGNMENTS = [{
      id: 'reviewer-assignment',
      reviewerUid: 'reviewer-1',
      packageType: 'skill',
      category: 'frontend',
      assignedByUid: 'admin-1',
      active: true,
      createdAt: '2026-08-25T08:00:00.000Z'
    }];

    let assignments = structuredClone(INITIAL_ASSIGNMENTS);

    function registry() {
      return `<div class="shell enter">
        <header class="shell-top">
          <span class="brand">Agent 技能平台</span>
          <nav class="nav" aria-label="主導覽"><span>技能池</span><span>我的安裝</span><span>上架技能</span><span>審核</span><span class="active">管理</span></nav>
        </header>
        <main class="main">
          <div class="crumb">管理後台 / 審核者管理</div>
          <header class="page-head">
            <div><h1>審核範圍登錄冊</h1><p class="subtitle">以 Package type × Category 指派跨團隊審核人；每次新增與撤銷都由伺服器寫入 Audit 與 Outbox。</p></div>
            <div class="head-stat"><strong data-total>${activeAssignments().length}</strong><span>個有效指派</span></div>
          </header>
          <nav class="admin-tabs" aria-label="管理後台功能"><button data-active>審核者管理</button><button type="button" data-unavailable>版本治理</button><button type="button" data-unavailable>稽核日誌</button></nav>
          <aside class="contract-note"><strong>API 契約缺口</strong><span>目前只有 <span class="mono">POST /api/admin/reviewers</span> 與 <span class="mono">DELETE /api/admin/reviewers/:id</span>；正式實作列表前需補上讀取指派的 GET 契約。本線框資料直接採用既有 <span class="mono">ReviewerAssignment</span> 測試 fixture。</span></aside>
          <div class="layout">
            <section class="card registry-card">
              <div class="card-head"><div><h2>有效指派</h2><p>同一 reviewerUid、packageType、category 只允許一個有效指派。</p></div><div class="tools"><div class="field filter"><label for="scope-filter">範圍篩選</label><select id="scope-filter" data-filter><option value="all">全部範圍</option><option value="skill">Package type：skill</option><option value="frontend">Category：frontend</option></select></div></div></div>
              <div class="desktop-table table-wrap"><table><thead><tr><th>審核者</th><th>Package type</th><th>Category</th><th>指派者</th><th>建立時間</th><th>狀態</th><th></th></tr></thead><tbody data-table-body></tbody></table></div>
              <div class="mobile-list" data-mobile-list></div>
              <div class="empty-state" data-empty>這個範圍目前沒有有效審核者指派。</div>
            </section>
            <aside class="card add-panel">
              <div class="card-head"><div><h2>新增審核者指派</h2><p>對應 POST /api/admin/reviewers</p></div></div>
              <form class="add-body" data-add-form>
                <div class="field"><label for="reviewer-uid">reviewerUid</label><input id="reviewer-uid" name="reviewerUid" value="outsider-1" maxlength="200" required></div>
                <div class="field"><label for="package-type">packageType</label><input id="package-type" name="packageType" value="skill" maxlength="100" required></div>
                <div class="field"><label for="category">category</label><input id="category" name="category" value="frontend" maxlength="100" required></div>
                <div class="add-note"><b>伺服器端授權</b><br>只有 global <span class="mono">platform_admin</span> 可以建立指派；前端可見性不取代權限檢查。</div>
                <div class="form-status" role="status" data-form-status></div>
                <button class="btn primary" type="submit">建立指派</button>
              </form>
            </aside>
          </div>
        </main>
        <footer class="foot"><span>Agent 技能平台 · 企業內部使用</span><span>ReviewerAssignment · PC / Mobile adaptive wireframe</span></footer>
        <dialog data-dialog><div class="dialog-body"><h2>撤銷這個審核者指派？</h2><p>撤銷後，這位使用者不能再審核此 Package type × Category 範圍的新提交。</p><div class="dialog-scope" data-dialog-scope></div><div class="dialog-actions"><button class="btn" type="button" data-cancel>返回</button><button class="btn stop" type="button" data-confirm>確認撤銷</button></div></div></dialog>
        <div class="toast" role="status" data-toast></div>
      </div>`;
    }

    const variants = [registry];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;
    let pendingRevokeId = null;

    function activeAssignments() { return assignments.filter((item) => item.active); }
    function escapeHtml(value) { const node = document.createElement('span'); node.textContent = value; return node.innerHTML; }
    function displayDate(value) { return new Intl.DateTimeFormat('zh-TW', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Tokyo' }).format(new Date(value)); }
    function filteredAssignments() {
      const value = stage.querySelector('[data-filter]')?.value ?? 'all';
      return activeAssignments().filter((item) => value === 'all' || item.packageType === value || item.category === value);
    }

    function tableRow(item) {
      return `<tr><td><span class="reviewer"><strong class="mono">${escapeHtml(item.reviewerUid)}</strong><small class="mono">${escapeHtml(item.id)}</small></span></td><td><span class="tag">${escapeHtml(item.packageType)}</span></td><td><span class="tag seal">${escapeHtml(item.category)}</span></td><td class="mono">${escapeHtml(item.assignedByUid)}</td><td class="mono">${displayDate(item.createdAt)}</td><td><span class="tag ok">有效</span></td><td><button class="btn stop" type="button" data-revoke="${escapeHtml(item.id)}">撤銷</button></td></tr>`;
    }

    function mobileCard(item) {
      return `<article class="mobile-card"><div class="mobile-top"><span class="reviewer"><strong class="mono">${escapeHtml(item.reviewerUid)}</strong><small class="mono">${escapeHtml(item.id)}</small></span><span class="tag ok">有效</span></div><div class="scope"><span class="tag">${escapeHtml(item.packageType)}</span><span class="tag seal">${escapeHtml(item.category)}</span></div><div class="mobile-meta"><div><span>指派者</span><strong class="mono">${escapeHtml(item.assignedByUid)}</strong></div><div><span>建立時間</span><strong class="mono">${displayDate(item.createdAt)}</strong></div></div><button class="btn stop" type="button" data-revoke="${escapeHtml(item.id)}">撤銷指派</button></article>`;
    }

    function renderAssignments() {
      const visible = filteredAssignments();
      stage.querySelector('[data-table-body]').innerHTML = visible.map(tableRow).join('');
      stage.querySelector('[data-mobile-list]').innerHTML = visible.map(mobileCard).join('');
      stage.querySelector('[data-empty]').style.display = visible.length ? 'none' : 'block';
      stage.querySelector('[data-total]').textContent = activeAssignments().length;
      stage.querySelectorAll('[data-revoke]').forEach((button) => button.addEventListener('click', () => openRevoke(button.dataset.revoke)));
    }

    function openRevoke(id) {
      const assignment = assignments.find((item) => item.id === id);
      if (!assignment) return;
      pendingRevokeId = id;
      stage.querySelector('[data-dialog-scope]').innerHTML = `<strong class="mono">${escapeHtml(assignment.reviewerUid)}</strong><br><span class="mono">${escapeHtml(assignment.packageType)} × ${escapeHtml(assignment.category)}</span>`;
      stage.querySelector('[data-dialog]').showModal();
    }

    function showToast(message) {
      const toast = stage.querySelector('[data-toast]');
      toast.textContent = message;
      toast.removeAttribute('data-show');
      void toast.offsetWidth;
      toast.setAttribute('data-show', '');
    }

    function wire() {
      renderAssignments();
      stage.querySelector('[data-filter]').addEventListener('change', renderAssignments);
      stage.querySelectorAll('[data-unavailable]').forEach((button) => button.addEventListener('click', () => showToast('本輪只探索審核者管理頁')));
      const dialog = stage.querySelector('[data-dialog]');
      stage.querySelector('[data-cancel]').addEventListener('click', () => dialog.close());
      stage.querySelector('[data-confirm]').addEventListener('click', () => {
        const assignment = assignments.find((item) => item.id === pendingRevokeId);
        if (assignment) assignment.active = false;
        pendingRevokeId = null;
        dialog.close();
        renderAssignments();
        showToast('指派已撤銷；伺服器將回傳 revokedAt 與 revokedByUid');
      });
      stage.querySelector('[data-add-form]').addEventListener('submit', (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        const reviewerUid = String(data.get('reviewerUid')).trim();
        const packageType = String(data.get('packageType')).trim();
        const category = String(data.get('category')).trim();
        const status = stage.querySelector('[data-form-status]');
        const duplicate = activeAssignments().some((item) => item.reviewerUid === reviewerUid && item.packageType === packageType && item.category === category);
        if (duplicate) { status.textContent = '這個有效指派已存在。'; status.style.color = 'var(--stop)'; return; }
        assignments.push({ id: 'server-returned-assignment-id', reviewerUid, packageType, category, assignedByUid: 'admin-1', active: true, createdAt: '2026-08-25T08:00:00.000Z' });
        status.textContent = '指派已建立；列表採用伺服器回傳的 ReviewerAssignment。';
        status.style.color = 'var(--ok)';
        stage.querySelector('[data-filter]').value = 'all';
        renderAssignments();
      });
    }

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); wire(); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>升級差異線框 · Upgrade Diff</title><style>
:root{--ink:#16181d;--soft:#5b616e;--faint:#8b91a0;--line:#dfe2e8;--line2:#edeff3;--paper:#fff;--ground:#f6f7f9;--accent:#1f4fd8;--accent2:#eef2fe;--ok:#1a7f52;--ok2:#e8f5ee;--warn:#8a5a00;--warn2:#fdf3e0;--stop:#a32020;--stop2:#fdeceb;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,monospace;--r:8px;--rl:11px;color-scheme:light dark}@media(prefers-color-scheme:dark){:root{--ink:#e8eaf0;--soft:#a2a9b8;--faint:#767d8d;--line:#2f333c;--line2:#24272e;--paper:#1a1d23;--ground:#131519;--accent:#7f9fff;--accent2:#1c2740;--ok:#5ec98e;--ok2:#14301f;--warn:#e0ab4c;--warn2:#33260d;--stop:#f08a80;--stop2:#3a1917}}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans)}button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.mono{font-family:var(--mono)}#stage{min-height:100vh;padding-bottom:92px}.shell{min-height:100vh;display:flex;flex-direction:column}.top{min-height:58px;padding:0 max(24px,calc((100vw - 1120px)/2));display:flex;align-items:center;gap:42px;background:var(--paper);border-bottom:1px solid var(--line)}.brand{font-size:16px;font-weight:750;white-space:nowrap}.nav{display:flex;gap:28px;color:var(--soft);white-space:nowrap}.nav span{padding:18px 0 16px;border-bottom:2px solid transparent}.nav .active{color:var(--accent);border-color:var(--accent);font-weight:650}.main{width:min(1120px,calc(100% - 48px));margin:auto;padding:32px 0 70px;flex:1}.foot{padding:20px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;background:var(--paper);border-top:1px solid var(--line);color:var(--faint);font-size:12px}
.crumb{margin-bottom:14px;color:var(--faint);font-size:12px}.crumb b{color:var(--soft);font-weight:500}
.head{display:flex;justify-content:space-between;align-items:start;gap:24px;margin-bottom:18px}.head h1{margin:0;font-size:27px;letter-spacing:-.03em}.head p{margin:7px 0 0;color:var(--soft)}
.vshift{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px;border:1px solid var(--line);border-radius:var(--rl);background:var(--paper)}.vbox{display:grid;gap:3px}.vbox span{color:var(--faint);font-size:10.5px;text-transform:uppercase}.vbox b{font-size:17px;font-family:var(--mono)}.arrow{color:var(--accent);font-size:19px}.dir{margin-left:auto;display:inline-flex;padding:5px 11px;border-radius:999px;background:var(--accent2);color:var(--accent);font-size:12px;font-weight:650}
.banner{display:flex;gap:12px;padding:15px 16px;margin-bottom:16px;border:1px solid var(--warn);border-radius:var(--rl);background:var(--warn2)}.banner.calm{border-color:var(--ok);background:var(--ok2)}.banner-i{font-size:18px;line-height:1.2}.banner h2{margin:0 0 5px;font-size:14.5px;color:var(--warn)}.banner.calm h2{color:var(--ok)}.banner p{margin:0;color:var(--soft);font-size:13px}.reasons{margin:9px 0 0;padding-left:18px;color:var(--soft);font-size:13px}.reasons li{margin-bottom:3px}
.grid{display:grid;grid-template-columns:1fr 316px;gap:16px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rl);box-shadow:0 1px 3px rgba(22,24,29,.06);overflow:hidden}.card-h{margin:0;padding:14px 16px;border-bottom:1px solid var(--line2);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}.card-h small{color:var(--faint);font-weight:400;font-size:11.5px}
.tgt{padding:15px 16px;border-bottom:1px solid var(--line2)}.tgt:last-child{border:0}.tgt-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.tgt-h b{font-size:13.5px}.chip{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:620;background:var(--line2);color:var(--soft)}.chip.added{background:var(--ok2);color:var(--ok)}.chip.removed{background:var(--stop2);color:var(--stop)}.chip.changed{background:var(--warn2);color:var(--warn)}.chip.unchanged{background:var(--ground);color:var(--faint)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.flag{display:inline-flex;padding:4px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground);color:var(--soft);font-size:11.5px}.flag[data-on]{border-color:var(--warn);background:var(--warn2);color:var(--warn);font-weight:620}
.digest{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;margin-top:11px;padding:10px 12px;border-radius:var(--r);background:var(--ground)}.digest span{display:block;color:var(--faint);font-size:10px;text-transform:uppercase}.digest b{display:block;margin-top:3px;font:11.5px/1.5 var(--mono);overflow-wrap:anywhere}
.opts{margin-top:11px;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}.opt{display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line2);font-size:12.5px}.opt:last-child{border:0}.opt-k{flex:none;width:19px;text-align:center;font-weight:700}.opt-k.add{color:var(--ok)}.opt-k.del{color:var(--stop)}.opt-k.mod{color:var(--warn)}.opt-b{display:grid;gap:2px}.opt-b code{font-family:var(--mono);font-size:12px}.opt-b small{color:var(--faint)}
.side{display:grid;gap:16px;position:sticky;top:18px}.notes{padding:15px 16px;color:var(--soft);font-size:13px;white-space:pre-wrap}.side .btn{width:100%}
.act{padding:15px 16px;display:grid;gap:9px}.btn{min-height:39px;padding:8px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);font-weight:620;white-space:nowrap}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}
.ack{display:flex;gap:9px;padding:12px 13px;border:1px solid var(--warn);border-radius:var(--r);background:var(--warn2);font-size:12.5px;color:var(--soft)}.ack input{margin:2px 0 0}
.rule{padding:10px 11px;margin:0 16px 15px;border-radius:var(--r);background:var(--accent2);color:var(--soft);font-size:11.5px}.rule b{color:var(--accent)}
.route{padding:11px 12px;margin:0 16px 15px;border-radius:var(--r);background:var(--ground);font:11.5px/1.6 var(--mono);overflow-wrap:anywhere}
.enter{animation:rise .22s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:900px){.grid{grid-template-columns:1fr}.side{position:static}}
@media(max-width:640px){.top{padding:10px 16px;align-items:start;gap:10px;flex-direction:column}.nav{width:100%;overflow:auto}.nav span{padding:6px 0 8px}.main{width:calc(100% - 32px);padding-top:22px}.foot{padding:17px 16px 96px;flex-direction:column}.head{flex-direction:column}.vshift{flex-wrap:wrap}.dir{margin-left:0}.digest{grid-template-columns:1fr}.digest .arrow{display:none}}
</style></head><body><div id="stage"></div><nav class="proto-picker"><span class="proto-picker-highlight"></span><button class="proto-picker-item" data-active aria-current="true">Upgrade Diff</button><span class="proto-picker-divider"></span><button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button></nav><script>
// 資料為 GET /api/packages/:packageId/versions/:version/diff/:targetVersion 的真實 VersionDiff 形狀。
// 差異刻意不含命令全文，只有 contentDigest、scriptVersion 與變更旗標。
const diff={packageId:'pkg-analytics',currentVersion:'1.9.0',targetVersion:'1.10.0',direction:'upgrade',releaseNotes:'支援 WSL 安裝目標。\n新增 --scope 選項可選擇安裝層級。\n解除安裝後保留使用者設定檔。',
scriptTargets:[
{targetOs:'linux/macos',clientRuntime:'codex',change:'changed',installCommandChanged:true,uninstallCommandChanged:false,usageInstructionsChanged:true,residualEffectsChanged:true,
 addedOptions:[{name:'--scope',type:'select',description:'安裝層級',defaultValue:'user',choices:['user','project']}],removedOptions:[],changedOptions:[],
 current:{scriptVersion:3,contentDigest:'9f2c41ab7d0e5583',hasResidualEffects:false,optionNames:[]},
 target:{scriptVersion:4,contentDigest:'c47e8810b96a2fd1',hasResidualEffects:true,optionNames:['--scope']}},
{targetOs:'windows',clientRuntime:'claude-code',change:'unchanged',installCommandChanged:false,uninstallCommandChanged:false,usageInstructionsChanged:false,residualEffectsChanged:false,
 addedOptions:[],removedOptions:[],changedOptions:[],
 current:{scriptVersion:2,contentDigest:'5b13d7fe02c4a998',hasResidualEffects:false,optionNames:[]},
 target:{scriptVersion:2,contentDigest:'5b13d7fe02c4a998',hasResidualEffects:false,optionNames:[]}},
{targetOs:'wsl',clientRuntime:'codex',change:'added',installCommandChanged:true,uninstallCommandChanged:true,usageInstructionsChanged:true,residualEffectsChanged:false,
 addedOptions:[{name:'--scope',type:'select',description:'安裝層級',defaultValue:'user',choices:['user','project']}],removedOptions:[],changedOptions:[],
 target:{scriptVersion:1,contentDigest:'2ad9f0417ce6b385',hasResidualEffects:false,optionNames:['--scope']}}],
residualEffects:{current:false,target:true,introduced:true},
requiresReapproval:true,
reapprovalReasons:[
{code:'RESIDUAL_EFFECTS_INTRODUCED',message:'目標版本新增了解除安裝後的殘留副作用'},
{code:'INSTALL_COMMAND_CHANGED',targetOs:'linux/macos',clientRuntime:'codex',message:'linux/macos × codex 的安裝命令已變更'},
{code:'SCRIPT_OPTIONS_CHANGED',targetOs:'linux/macos',clientRuntime:'codex',message:'linux/macos × codex 的安裝選項參數已變更'},
{code:'SCRIPT_TARGET_ADDED',targetOs:'wsl',clientRuntime:'codex',message:'新增安裝目標 wsl × codex'}]};
const CH={added:'新增目標',removed:'移除目標',changed:'已變更',unchanged:'無變更'};
const esc=s=>{const n=document.createElement('span');n.textContent=s;return n.innerHTML};
const side=(s,label)=>s?`<div><span>${label} v${s.scriptVersion}</span><b>${esc(s.contentDigest)}</b></div>`:`<div><span>${label}</span><b style="color:var(--faint)">不存在</b></div>`;
const opt=(o,k,cls)=>`<div class="opt"><span class="opt-k ${cls}">${k}</span><span class="opt-b"><code>${esc(o.name)}</code><small>${esc(o.description)}${o.choices?' · '+o.choices.join(' / '):''}</small></span></div>`;
const tgt=t=>{const opts=[...t.addedOptions.map(o=>opt(o,'+','add')),...t.removedOptions.map(o=>opt(o,'−','del')),...t.changedOptions.map(c=>opt(c.target,'~','mod'))].join('');
return `<div class="tgt"><div class="tgt-h"><b class="mono">${esc(t.targetOs)} × ${esc(t.clientRuntime)}</b><span class="chip ${t.change}">${CH[t.change]}</span></div>
${t.change==='unchanged'?'':`<div class="flags"><span class="flag" ${t.installCommandChanged?'data-on':''}>安裝命令</span><span class="flag" ${t.uninstallCommandChanged?'data-on':''}>解除安裝命令</span><span class="flag" ${t.usageInstructionsChanged?'data-on':''}>使用說明</span><span class="flag" ${t.residualEffectsChanged?'data-on':''}>殘留副作用</span></div>`}
<div class="digest">${side(t.current,'目前')}<b class="arrow">→</b>${side(t.target,'目標')}</div>
${opts?`<div class="opts">${opts}</div>`:''}</div>`};
const page=()=>`<div class="shell enter"><header class="top"><b class="brand">Agent 技能平台</b><nav class="nav"><span>技能池</span><span class="active">我的安裝</span><span>上架技能</span><span>審核</span></nav></header><main class="main">
<div class="crumb">我的安裝 · <b>分析工具</b> · 升級差異</div>
<header class="head"><div><h1>升級差異</h1><p>比較你目前安裝的版本與目標版本；差異由每個「系統 × Client」的目前腳本指標精確導出。</p></div></header>
<div class="vshift"><div class="vbox"><span>目前版本</span><b>${esc(diff.currentVersion)}</b></div><b class="arrow">→</b><div class="vbox"><span>目標版本</span><b>${esc(diff.targetVersion)}</b></div><span class="dir">${diff.direction==='upgrade'?'升級':diff.direction==='downgrade'?'降級':'相同版本'}</span></div>
${diff.requiresReapproval?`<div class="banner"><span class="banner-i">⚠</span><div><h2>這次升級需要你重新確認</h2><p>命令、選項或殘留副作用已改變，你上次安裝時的判斷依據不再成立。</p><ul class="reasons">${diff.reapprovalReasons.map(r=>`<li>${esc(r.message)}</li>`).join('')}</ul></div></div>`:`<div class="banner calm"><span class="banner-i">✓</span><div><h2>沒有需要重新確認的變更</h2><p>命令、選項與殘留副作用皆未改變。</p></div></div>`}
<div class="grid"><section class="card"><h2 class="card-h">安裝目標逐項差異<small>${diff.scriptTargets.length} 個組合</small></h2>${diff.scriptTargets.map(tgt).join('')}
<div class="rule"><b>為什麼看不到命令內容</b><br>中部命令是平台內部腳本片段，不是升級決策依據。此頁只顯示「哪裡變了」；要看會在你機器上執行的完整腳本，請到安裝頁。</div></section>
<aside class="side">${diff.releaseNotes?`<section class="card"><h2 class="card-h">版本說明</h2><div class="notes">${esc(diff.releaseNotes)}</div></section>`:''}
<section class="card"><h2 class="card-h">殘留副作用</h2><div class="notes">${diff.residualEffects.introduced?'目標版本<b>新增</b>了殘留副作用：解除安裝後仍會保留部分內容，需要手動清理。清理步驟在安裝頁完整顯示。':diff.residualEffects.target?'兩個版本都有殘留副作用，本次沒有新增。':'兩個版本都沒有殘留副作用。'}</div></section>
<section class="card"><h2 class="card-h">下一步</h2><div class="act">${diff.requiresReapproval?`<label class="ack"><input type="checkbox" data-ack><span>我已閱讀上述變更，了解升級後行為與現在不同。</span></label>`:''}<button class="btn primary" data-go ${diff.requiresReapproval?'disabled':''}>檢視並下載升級腳本</button><button class="btn" data-back>返回我的安裝</button></div>
<div class="route" data-route>/packages/${diff.packageId}/versions/${diff.targetVersion}/install</div></section></aside></div>
</main><footer class="foot"><span>Agent 技能平台 · 企業內部使用</span><span>VersionDiff · PC-first wireframe</span></footer></div>`;
const stage=document.querySelector('#stage');
function mount(){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=page();wire()})}
function wire(){const ack=stage.querySelector('[data-ack]'),go=stage.querySelector('[data-go]');
if(ack)ack.onchange=()=>{go.disabled=!ack.checked};
go.onclick=()=>{stage.querySelector('[data-route]').textContent='線框導向安裝頁；升級不需要新端點，沿用既有 POST .../scripts 生成目標版本腳本。'};
stage.querySelector('[data-back]').onclick=()=>{stage.querySelector('[data-route]').textContent='/me/installations'}}
mount();
const picker=document.querySelector('.proto-picker'),item=picker.querySelector('.proto-picker-item:not(.proto-picker-replay)'),hi=picker.querySelector('.proto-picker-highlight');requestAnimationFrame(()=>requestAnimationFrame(()=>{hi.style.width=item.offsetWidth+'px';hi.style.transform=`translateX(${item.offsetLeft}px)`}));picker.querySelector('.proto-picker-replay').onclick=mount;
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')mount()});
</script></body></html>

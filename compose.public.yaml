name: agent-skill-platform-public

# 公網部署：獨立域名 + 自動 HTTPS，供同事以各自帳號實際操作。
#
#   npm run public:up      啟動（首次會自動申請憑證）
#   npm run public:logs    追蹤日誌
#   npm run public:down    停止（保留資料）
#
# 與 compose.deploy.yaml 的差別：前面多一層 Caddy 處理 TLS，
# app 因此不再對宿主機開放 port，只有 Caddy 連得到。
#
# 環境變數由 .env.deploy 提供（不進版本控制），範本見 .env.deploy.example。
# 完整上線步驟見 docs/公網部署指南.md。
#
# 重要：本檔為 NODE_ENV=production，模擬 IdP 不會啟動也不該啟動。
# 同事透過真實 IdP（GitHub OAuth 或公司 IdP）登入，角色由管理員在平台介面指派。

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_skill_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必須設定}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_skill_platform}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 不對外開放 port：資料庫只服務同一 compose 網路內的平台。

  migrate:
    build:
      context: .
    image: agent-skill-platform:local
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 必須設定}
    command: ["node", "dist/migrate.js"]

  app:
    build:
      context: .
    image: agent-skill-platform:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 刻意不設 ports：對外一律經過 Caddy，避免繞過 TLS 直連。
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT}
      PLATFORM_BASE_URL: https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN 必須設定}
      BOOTSTRAP_ADMIN_UID: ${BOOTSTRAP_ADMIN_UID:?BOOTSTRAP_ADMIN_UID 必須設定}
      # 登入白名單：公網環境建議設定，避免任何持有 IdP 帳號者都能建立 identity。
      LOGIN_ALLOWED_UIDS: ${LOGIN_ALLOWED_UIDS}
      # SSO：六個變數全有或全無，未配置時登入 fail-closed。
      OIDC_AUTHORIZE_URL: ${OIDC_AUTHORIZE_URL:?OIDC_AUTHORIZE_URL 必須設定}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:?OIDC_TOKEN_URL 必須設定}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:?OIDC_USERINFO_URL 必須設定}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID 必須設定}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET 必須設定}
      OIDC_REDIRECT_URI: https://${PUBLIC_DOMAIN}/api/auth/callback
      OIDC_SCOPE: ${OIDC_SCOPE}
      OIDC_CLAIM_UID: ${OIDC_CLAIM_UID}
      OIDC_CLAIM_DISPLAY_NAME: ${OIDC_CLAIM_DISPLAY_NAME}
      OIDC_CLAIM_TEAMS: ${OIDC_CLAIM_TEAMS}
      NOTIFY_SLACK_WEBHOOK_URL: ${NOTIFY_SLACK_WEBHOOK_URL}
      NOTIFY_TEAMS_WEBHOOK_URL: ${NOTIFY_TEAMS_WEBHOOK_URL}
      NOTIFY_LARK_WEBHOOK_URL: ${NOTIFY_LARK_WEBHOOK_URL}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL 必須設定}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 憑證必須持久化：重建容器若重新申請，會撞上 Let's Encrypt 的簽發頻率限制。
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
